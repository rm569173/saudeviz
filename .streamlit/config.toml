# Tema fixo em claro, de proposito.
#
# A paleta de graficos foi validada contra uma superficie clara: os contrastes
# e a separacao perceptual entre series sob daltonismo valem para esse fundo.
# Deixar o tema seguir a preferencia do sistema faria o painel alternar entre
# um estado validado e outro nao validado conforme quem abre - inaceitavel num
# painel que sera avaliado e apresentado ao vivo.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f2"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
